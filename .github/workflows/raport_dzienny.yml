name: Raport dzienny (e-mail)

# JEDEN mail na dobe: co POBRANO z MF i co STRESZCZONO.
#
# Do 21.09.2026 przychodzily dwa listy — jeden wysylala sama synchronizacja
# dzienna, drugi raport o streszczeniach. Mowily o dwoch polowach tej samej
# doby. Zyczenie wlasciciela: „jeden mail z jednym i drugim wystarczy".
#
# Ustawienie ma jeszcze jedna zalete. Poprzednio list o pobieraniu wysylal sam
# przebieg synchronizacji, wiec gdy ten ginal na limicie czasu (19 i 20.09.2026,
# prace serwisowe MF), nie przychodzilo NIC — cisza nie do odroznienia od
# spokojnego dnia. Teraz raport jest osobnym przebiegiem i powie wprost,
# ze pobieranie stoi.
#
# 6:00 UTC (8:00 czasu polskiego): po nocnej pracy automatu streszczajacego
# i po porannej synchronizacji (4:30 UTC).
#
# Czyta baze W CHMURZE, bo tam pisza oba automaty. Raport liczony z Dockera
# pokazywalby stan sprzed ostatniej synchronizacji.

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: raport-dzienny
  cancel-in-progress: false

jobs:
  raportuj:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary

      - name: Wyslij raport
        env:
          SUPABASE_HOST:          ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT:          ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB:            ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER:          ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD:      ${{ secrets.SUPABASE_PASSWORD }}
          GMAIL_ADRES:            ${{ secrets.GMAIL_ADRES }}
          GMAIL_HASLO_APLIKACJI:  ${{ secrets.GMAIL_HASLO_APLIKACJI }}
          EMAIL_ODBIORCA:         ${{ secrets.EMAIL_ODBIORCA }}
        # Skrypt konczy sie kodem bledu, gdy poczta odmowi — cicha awaria
        # wysylki jest gorsza od braku maila, bo nikt nie wie, ze raport
        # przestal przychodzic (tak przez dobe chodzilo uniewaznione haslo
        # aplikacji Gmaila, 17.09.2026).
        run: python raport_dzienny.py
