name: Synchronizacja dzienna

on:
  schedule:
    # GitHub Actions cron dziala w UTC i NIE zna stref czasowych.
    # Godziny ustawione pod czas LETNI (Polska = UTC+2); zima wszystko
    # przesuwa sie o godzine pozniej wzgledem zegara polskiego. Swiadomie:
    # alternatywa (dwie pary cronow + odsiewanie w skrypcie) komplikuje kod
    # bardziej, niz jest warta.
    #
    # RUTYNA: WASKIE OKNO, RAZ W TYGODNIU SZEROKIE
    #   Kazdy dzien jest sprawdzany przy kazdym przebiegu, wiec przy oknie
    #   5-dniowym i dwoch przebiegach dziennie dzien wpada w kontrole
    #   dziesieciokrotnie. Interpretacje publikowane przez MF z kilkutygodniowym
    #   poslizgiem lapie niedzielny przebieg z oknem 30 dni.
    #
    #   Powod jest jeden: mniej zapytan o listy do MF przy tej samej
    #   szczelnosci. Codzienne przemielanie dziesieciu dni dla kazdego podatku
    #   bylo najwiekszym stalym obciazeniem, jakie im robimy.
    - cron: '30 4 * * 1-6'   # 06:30 PL, poniedzialek-sobota — okno 5 dni
    - cron: '30 21 * * *'    # 23:30 PL, codziennie          — okno 5 dni
    - cron: '30 1 * * 0'     # 03:30 PL, niedziela           — okno 30 dni

  # Reczne uruchomienie: z zakladki Actions albo z modulu Harmonogram w Dockerze
  # (wykonawca). Przebiegi z harmonogramu nie maja wejsc — ida w trybie zwykly.
  workflow_dispatch:
    inputs:
      tryb:
        description: 'zwykly — wszystkie podatki; podatek — pierwsze pobranie podatku dodanego z EUREKI; slownik — lista ustaw z EUREKI; sprawdz — diagnostyka dodanego podatku (nic nie zapisuje)'
        type: choice
        options: [zwykly, podatek, slownik, sprawdz]
        default: zwykly
      podatek:
        description: 'Tylko w trybie podatek: skrot dodany w Dockerze, np. CUKIER'
        type: string
        default: ''
      okno:
        description: 'Okno w dniach wstecz (puste = 5; niedzielny przebieg i tak bierze 30)'
        type: string
        default: ''

jobs:
  synchronizuj:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v5

      - name: Ustaw Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Zainstaluj zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install requests PyPDF2 python-docx beautifulsoup4 lxml psycopg2-binary

      - name: Uruchom synchronizacje dzienna
        env:
          SUPABASE_HOST:          ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT:          ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB:            ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER:          ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD:      ${{ secrets.SUPABASE_PASSWORD }}
          GMAIL_ADRES:            ${{ secrets.GMAIL_ADRES }}
          GMAIL_HASLO_APLIKACJI:  ${{ secrets.GMAIL_HASLO_APLIKACJI }}
          EMAIL_ODBIORCA:         ${{ secrets.EMAIL_ODBIORCA }}
          # Wejscia trafiaja do skryptu przez zmienne, nigdy wprost do polecenia
          # powloki — skrot podatku sprawdza sam skrypt.
          TRYB_SYNC:              ${{ inputs.tryb || 'zwykly' }}
          PODATEK_SYNC:           ${{ inputs.podatek || '' }}
          # Okno rutynowe 5 dni; niedzielny przebieg siega 30 dni wstecz.
          OKNO_SYNCHRONIZACJI_DNI: ${{ github.event.schedule == '30 1 * * 0' && '30' || '5' }}
          # Reczne uruchomienie moze podac swoje okno — skrypt woli te wartosc.
          OKNO_RECZNE:            ${{ inputs.okno || '' }}
        run: python synchronizacja_dzienna.py

      - name: Podsumowanie
        if: always()
        run: echo "Synchronizacja zakonczona. Sprawdz logi powyzej dla szczegolow."
