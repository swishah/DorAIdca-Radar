name: Synchronizacja dzienna

on:
  schedule:
    # GitHub Actions cron dziala w UTC i NIE zna stref czasowych.
    # Ponizsze godziny sa ustawione pod czas LETNI (Polska = UTC+2):
    #   04:30 UTC -> 06:30 PL
    #   21:30 UTC -> 23:30 PL
    # Zima (UTC+1) wszystko przesunie sie o godzine pozniej wzgledem zegara
    # polskiego: 05:30 i 22:30. Swiadomie akceptujemy to przesuniecie -
    # alternatywa (dwie pary cronow + odsiewanie w skrypcie) komplikuje
    # kod bardziej, niz jest warta.
    #
    # Dwa przebiegi zamiast jednego: rano zbiera to, co MF opublikowalo w nocy,
    # wieczorem to, co doszlo w ciagu dnia roboczego.
    - cron: '30 4 * * *'
    - cron: '30 21 * * *'

  # Reczne uruchomienie: z zakladki Actions albo z modulu Harmonogram w Dockerze
  # (wykonawca). Przebiegi z harmonogramu nie maja wejsc — ida w trybie zwykly.
  workflow_dispatch:
    inputs:
      tryb:
        description: 'zwykly — wszystkie podatki; podatek — pierwsze pobranie podatku dodanego z EUREKI; slownik — lista ustaw z EUREKI'
        type: choice
        options: [zwykly, podatek, slownik]
        default: zwykly
      podatek:
        description: 'Tylko w trybie podatek: skrot dodany w Dockerze, np. CUKIER'
        type: string
        default: ''

jobs:
  synchronizuj:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v5

      - name: Ustaw Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Zainstaluj zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install requests PyPDF2 python-docx beautifulsoup4 lxml psycopg2-binary

      - name: Uruchom synchronizacje dzienna
        env:
          SUPABASE_HOST:          ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT:          ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB:            ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER:          ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD:      ${{ secrets.SUPABASE_PASSWORD }}
          GMAIL_ADRES:            ${{ secrets.GMAIL_ADRES }}
          GMAIL_HASLO_APLIKACJI:  ${{ secrets.GMAIL_HASLO_APLIKACJI }}
          EMAIL_ODBIORCA:         ${{ secrets.EMAIL_ODBIORCA }}
          # Wejscia trafiaja do skryptu przez zmienne, nigdy wprost do polecenia
          # powloki — skrot podatku sprawdza sam skrypt.
          TRYB_SYNC:              ${{ inputs.tryb || 'zwykly' }}
          PODATEK_SYNC:           ${{ inputs.podatek || '' }}
        run: python synchronizacja_dzienna.py

      - name: Podsumowanie
        if: always()
        run: echo "Synchronizacja zakonczona. Sprawdz logi powyzej dla szczegolow."
