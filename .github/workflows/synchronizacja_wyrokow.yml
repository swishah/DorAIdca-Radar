name: Synchronizacja wyrokow CBOSA

on:
  schedule:
    # Niedziela 03:30 UTC (ok. 4:30/5:30 czasu polskiego) — po nocnej
    # synchronizacji interpretacji, w porze najmniejszego ruchu na CBOSA.
    - cron: '30 3 * * 0'

  # Reczne uruchomienie z zakladki Actions. Tryb "kalibracja" NIE zapisuje
  # nic do bazy — testuje tylko parser na zywym CBOSA (uzyj przy PIERWSZYM
  # uruchomieniu, zanim wlaczysz tryb pelny).
  workflow_dispatch:
    inputs:
      tryb:
        description: 'Tryb pracy'
        required: true
        type: choice
        options:
          - 'kalibracja'
          - 'pelny'
        default: 'kalibracja'
      strumienie:
        description: 'Strumienie (tylko tryb pelny), np. 1,2,3'
        required: false
        default: '1,2,3'
      dni_metadanych:
        description: >-
          Ile dni wstecz dla strumienia metadanych. Puste = 10 (normalny bieg).
          Podnies TYLKO do nadrobienia zaleglosci: gdy zadanie stalo dluzej niz
          10 dni, powstaje dziura, ktorej zwykly przebieg nigdy nie zobaczy.
        required: false
        default: ''
      dni_uzasadnien:
        description: >-
          Ile dni wstecz dla strumienia uzasadnien. Puste = 180. Zejdz nizej
          (np. 60) przy pierwszym nadrabianiu — kazdy dokument to kilkadziesiat
          tysiecy znakow w bazie, wiec warto zaczac od wezszego okna.
        required: false
        default: ''
      tylko_metadane:
        description: 'Tryb lekki: 1 = bez tresci uzasadnien, 0 = z uzasadnieniami'
        required: false
        type: choice
        options:
          - '0'
          - '1'
        default: '0'

jobs:
  synchronizuj-wyroki:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Ustaw Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Zainstaluj zaleznosci
        run: |
          python -m pip install --upgrade pip
          # Z requirements.txt, NIE z listy wpisanej tutaj. Powod jest konkretny:
          # 31.07.2026 skrypt dostal `import utils`, a utils.py importuje PyPDF2,
          # ktorego na tej liscie nie bylo. Zadanie zaczelo padac na imporcie,
          # zanim dotknelo CBOSA, i padalo tak przez piec kolejnych niedziel.
          # Lista wpisana recznie zawsze rozjedzie sie z kodem przy nastepnym
          # nowym imporcie — requirements.txt nie moze.
          pip install -r requirements.txt

      # MOST DO CBOSA — bez niego kazdy krok ponizej padnie na SSLEOFError.
      # orzeczenia.nsa.gov.pl od 11.09.2026 odcina adresy runnerow GitHuba:
      # TCP sie nawiazuje, po czym serwer zamyka polaczenie bez slowa, tak samo
      # na porcie 80 i 443, dla Pythona, curla i openssl s_client, na obrazie
      # ubuntu-24 i ubuntu-22. Po naszej stronie nie ma czego naprawiac, wiec
      # zadania ida przez funkcje brzegowa Supabase (repozytorium infra,
      # supabase/functions/most-cbosa), ktorej CBOSA odpowiada normalnie.
      # Parser zostaje tutaj, w Pythonie — przez most ida tylko surowe zadania.
      - name: Kalibracja (bez zapisu do bazy)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tryb == 'kalibracja'
        env:
          CBOSA_MOST_URL:    ${{ secrets.CBOSA_MOST_URL }}
          CBOSA_MOST_KLUCZ:  ${{ secrets.CBOSA_MOST_KLUCZ }}
        run: python synchronizacja_wyrokow.py --kalibracja

      - name: Synchronizacja pelna (reczna)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.tryb == 'pelny'
        env:
          CBOSA_MOST_URL:    ${{ secrets.CBOSA_MOST_URL }}
          CBOSA_MOST_KLUCZ:  ${{ secrets.CBOSA_MOST_KLUCZ }}
          WYROKI_TYLKO_METADANE: ${{ github.event.inputs.tylko_metadane }}
          WYROKI_OKNO_METADANE_DNI: ${{ github.event.inputs.dni_metadanych }}
          WYROKI_OKNO_UZASADNIEN_DNI: ${{ github.event.inputs.dni_uzasadnien }}
          SUPABASE_HOST:     ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT:     ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB:       ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER:     ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: python synchronizacja_wyrokow.py --strumienie "${{ github.event.inputs.strumienie }}"

      - name: Synchronizacja pelna (harmonogram niedzielny)
        if: github.event_name == 'schedule'
        env:
          CBOSA_MOST_URL:    ${{ secrets.CBOSA_MOST_URL }}
          CBOSA_MOST_KLUCZ:  ${{ secrets.CBOSA_MOST_KLUCZ }}
          # Niedzielny przebieg pobiera TRESCI uzasadnien (strumien 2).
          # Do 22.09.2026 stala tu domyslna jedynka i strumien 2 byl po cichu
          # wycinany z kazdego przebiegu — same metadane rosly, uzasadnienia
          # nie dochodzily od 19.07.2026 i nikt tego nie widzial.
          WYROKI_TYLKO_METADANE: '0'
          WYROKI_OKNO_METADANE_DNI: ${{ github.event.inputs.dni_metadanych }}
          SUPABASE_HOST:     ${{ secrets.SUPABASE_HOST }}
          SUPABASE_PORT:     ${{ secrets.SUPABASE_PORT }}
          SUPABASE_DB:       ${{ secrets.SUPABASE_DB }}
          SUPABASE_USER:     ${{ secrets.SUPABASE_USER }}
          SUPABASE_PASSWORD: ${{ secrets.SUPABASE_PASSWORD }}
        run: python synchronizacja_wyrokow.py

      - name: Podsumowanie
        if: always()
        run: echo "Zadanie zakonczone. Sprawdz logi powyzej."
